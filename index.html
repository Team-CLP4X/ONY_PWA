<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ONY</title>
    <meta
      name="description"
      content="Designed for Malaysian young adults, this emotional-support app offers a friendly chatbot, community engagement, and personalized resources for everyday well-being."
    />
    <meta property="og:title" content="ONY" />
    <meta
      property="og:description"
      content="Designed for Malaysian young adults, this emotional-support app offers a friendly chatbot, community engagement, and personalized resources for everyday well-being."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fff9f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ONY" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <script>
      // Suppress benign preview WebSocket close rejections (HMR disabled in container preview)
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && (event.reason ? (event.reason.message || String(event.reason)) : '');
        if (
          typeof reason === 'string' &&
          (reason.indexOf('WebSocket') !== -1 ||
            reason.indexOf('websocket') !== -1 ||
            reason.indexOf('ws:') !== -1)
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = event && (event.message || '');
        if (
          typeof msg === 'string' &&
          (msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('ws:') !== -1)
        ) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
