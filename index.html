    <meta
      name="description"
      content="Designed for Malaysian young adults, this emotional-support app offers a friendly chatbot, community engagement, and personalized resources for everyday well-being."
    />
    <meta property="og:title" content="ONY" />
    <meta
      property="og:description"
      content="Designed for Malaysian young adults, this emotional-support app offers a friendly chatbot, community engagement, and personalized resources for everyday well-being."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fff9f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <script>
      // Suppress benign Vite preview WebSocket rejections (HMR is disabled in container preview)
      (function () {
        var isWsError = function (val) {
          if (!val) return false;
          var str = typeof val === 'string' ? val : (val.message || String(val));
          return typeof str === 'string' && (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('websocket') !== -1 ||
            str.indexOf('[vite] failed to connect') !== -1 ||
            str.indexOf('ws:') !== -1
          );
        };
        var origConsoleError = console.error;
        console.error = function () {
          for (var i = 0; i < arguments.length; i++) {
            if (isWsError(arguments[i])) return;
          }
          return origConsoleError.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function (event) {
          if (isWsError(event && event.reason)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
        window.addEventListener('error', function (event) {
          if (isWsError(event && (event.message || event.error))) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
